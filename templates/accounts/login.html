<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SATPAY</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background: #ffffff;
            border-radius: 6px;
            border: 1px solid #e5e5e5;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.035);
            padding: 40px 35px;
        }

        /* Logo / Brand */
        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-icon {
            width: 64px;
            height: 64px;
            background: #fff5e9;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }

        .brand-icon i {
            font-size: 32px;
            color: #f28c18;
        }

        .brand h3 {
            font-size: 22px;
            font-weight: 600;
            color: #333333;
            margin: 0;
        }

        .brand p {
            color: #999999;
            font-size: 14px;
            margin-top: 4px;
            margin-bottom: 0;
        }

        /* Form */
        .form-label {
            font-weight: 500;
            font-size: 14px;
            color: #555555;
        }

        .form-control {
            border: 1px solid #dcdcdc;
            border-radius: 4px;
            min-height: 44px;
            padding: 10px 14px;
            box-shadow: none;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: #f28c18;
            box-shadow: 0 0 0 0.15rem rgba(242, 140, 24, 0.12);
        }

        .input-group-text {
            border: 1px solid #dcdcdc;
            border-radius: 4px;
            background: transparent;
            color: #999999;
            cursor: pointer;
            min-height: 44px;
        }

        .input-group-text:hover {
            background: #fff5e9;
            color: #f28c18;
        }

        .btn-login {
            background: #f28c18;
            border: none;
            color: #ffffff;
            padding: 12px;
            border-radius: 4px;
            font-weight: 500;
            font-size: 16px;
            width: 100%;
            transition: all 0.2s ease;
        }

        .btn-login:hover {
            background: #df7d0d;
            color: #ffffff;
        }

        .btn-login i {
            margin-right: 8px;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #777777;
        }

        .footer a {
            color: #f28c18;
            text-decoration: none;
            font-weight: 500;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Error messages */
        .alert {
            border-radius: 4px;
            border: 1px solid #f5c6cb;
            background: #f8d7da;
            color: #721c24;
            padding: 12px 16px;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .alert i {
            margin-right: 8px;
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            border-top: 1px solid #e5e5e5;
        }

        .divider span {
            padding: 0 15px;
            color: #999999;
            font-size: 13px;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-card {
                padding: 30px 20px;
            }
            
            .brand h3 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

<div class="login-container">

    <div class="login-card">

        <!-- Brand -->
        <div class="brand">
            <div class="brand-icon">
                <i class="bi bi-tv"></i>
            </div>
            <h3>SATPAY</h3>
            <p>Payment Management Portal</p>
        </div>

        <!-- Error Messages -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert">
                    <i class="bi bi-exclamation-circle"></i>
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <!-- Login Form -->
        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">
                    <i class="bi bi-phone" style="color: #f28c18;"></i>
                    Phone Number
                </label>
                <input type="text" 
                       name="phone_number" 
                       class="form-control" 
                       placeholder="Enter phone number (07XXXXXXXX)" 
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">
                    <i class="bi bi-lock" style="color: #f28c18;"></i>
                    Password
                </label>
                <div class="input-group">
                    <input type="password" 
                           name="password" 
                           id="passwordInput"
                           class="form-control" 
                           placeholder="Enter your password" 
                           required>
                    <span class="input-group-text" onclick="togglePassword()">
                        <i class="bi bi-eye" id="eyeIcon"></i>
                    </span>
                </div>
            </div>

            <button type="submit" class="btn-login">
                <i class="bi bi-box-arrow-in-right"></i>
                Login
            </button>

        </form>

        <!-- Divider -->
        <div class="divider">
            <span>or</span>
        </div>

        <!-- Footer -->
        <div class="footer">
            Don't have an account? 
            <a href="{% url 'register' %}">Register Here</a>
        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Password Toggle Script -->
<script>
function togglePassword() {
    const passwordInput = document.getElementById('passwordInput');
    const eyeIcon = document.getElementById('eyeIcon');
    
    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.classList.remove('bi-eye');
        eyeIcon.classList.add('bi-eye-slash');
    } else {
        passwordInput.type = 'password';
        eyeIcon.classList.remove('bi-eye-slash');
        eyeIcon.classList.add('bi-eye');
    }
}
</script>

</body>
</html>
