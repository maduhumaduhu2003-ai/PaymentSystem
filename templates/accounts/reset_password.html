<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - SATPAY</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: Arial, sans-serif;
            background: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container-card {
            width: 100%;
            max-width: 420px;
        }

        .card-main {
            background: #ffffff;
            border-radius: 6px;
            border: 1px solid #e5e5e5;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.035);
            padding: 40px 35px;
        }

        .brand { text-align: center; margin-bottom: 30px; }

        .brand-icon {
            width: 64px;
            height: 64px;
            background: #fff5e9;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }

        .brand-icon i { font-size: 32px; color: #f28c18; }

        .brand h3 {
            font-size: 22px;
            font-weight: 600;
            color: #333333;
            margin: 0;
        }

        .brand p {
            color: #999999;
            font-size: 14px;
            margin-top: 4px;
            margin-bottom: 0;
        }

        .form-label {
            font-weight: 500;
            font-size: 14px;
            color: #555555;
        }

        .form-control {
            border: 1px solid #dcdcdc;
            border-radius: 4px;
            min-height: 44px;
            padding: 10px 14px;
            box-shadow: none;
        }

        .form-control:focus {
            border-color: #f28c18;
            box-shadow: 0 0 0 0.15rem rgba(242, 140, 24, 0.12);
        }

        .input-group-text {
            border: 1px solid #dcdcdc;
            border-radius: 4px;
            background: transparent;
            color: #999999;
            cursor: pointer;
            min-height: 44px;
        }

        .input-group-text:hover {
            background: #fff5e9;
            color: #f28c18;
        }

        .btn-primary {
            background: #f28c18;
            border: none;
            color: #ffffff;
            padding: 12px;
            border-radius: 4px;
            font-weight: 500;
            font-size: 16px;
            width: 100%;
        }

        .btn-primary:hover {
            background: #df7d0d;
            color: #ffffff;
        }

        .alert {
            border-radius: 4px;
            padding: 12px 16px;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .alert-danger {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

<div class="container-card">
    <div class="card-main">

        <div class="brand">
            <div class="brand-icon">
                <i class="bi bi-key"></i>
            </div>
            <h3>Reset Password</h3>
            <p>Set your new password</p>
        </div>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">
                    <i class="bi bi-lock" style="color: #f28c18;"></i>
                    New Password
                </label>
                <div class="input-group">
                    {{ form.new_password }}
                    <span class="input-group-text" onclick="togglePassword('newPasswordInput', 'eyeIcon1')">
                        <i class="bi bi-eye" id="eyeIcon1"></i>
                    </span>
                </div>
                {% if form.new_password.errors %}
                    <div class="text-danger small mt-1">{{ form.new_password.errors }}</div>
                {% endif %}
            </div>

            <div class="mb-4">
                <label class="form-label">
                    <i class="bi bi-check-circle" style="color: #f28c18;"></i>
                    Confirm Password
                </label>
                <div class="input-group">
                    {{ form.confirm_password }}
                    <span class="input-group-text" onclick="togglePassword('confirmPasswordInput', 'eyeIcon2')">
                        <i class="bi bi-eye" id="eyeIcon2"></i>
                    </span>
                </div>
                {% if form.confirm_password.errors %}
                    <div class="text-danger small mt-1">{{ form.confirm_password.errors }}</div>
                {% endif %}
            </div>

            <button type="submit" class="btn-primary">
                <i class="bi bi-check-circle me-1"></i>
                Change Password
            </button>

        </form>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
function togglePassword(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');
    }
}
</script>

</body>
</html>
