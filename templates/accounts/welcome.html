<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - SATPAY</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .welcome-container {
            width: 100%;
            max-width: 520px;
        }

        .welcome-card {
            background: #ffffff;
            border-radius: 6px;
            border: 1px solid #e5e5e5;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.035);
            padding: 50px 40px;
            text-align: center;
        }

        /* Logo */
        .logo-wrapper {
            margin-bottom: 25px;
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            background: #fff5e9;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }

        .logo-icon i {
            font-size: 40px;
            color: #f28c18;
        }

        /* Heading */
        .welcome-card h1 {
            font-size: 28px;
            font-weight: 600;
            color: #333333;
            margin-bottom: 8px;
        }

        .welcome-card .subtitle {
            color: #f28c18;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .welcome-card .description {
            color: #777777;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* Features */
        .features {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .feature-item {
            background: #fafafa;
            border-radius: 6px;
            padding: 15px 10px;
            border: 1px solid #e5e5e5;
            transition: all 0.2s ease;
        }

        .feature-item:hover {
            background: #fff5e9;
            border-color: #f28c18;
        }

        .feature-item i {
            font-size: 24px;
            color: #f28c18;
            display: block;
            margin-bottom: 8px;
        }

        .feature-item span {
            font-size: 12px;
            color: #555555;
            font-weight: 500;
        }

        /* Buttons */
        .btn-get-started {
            background: #f28c18;
            border: none;
            color: #ffffff;
            padding: 12px 40px;
            border-radius: 4px;
            font-weight: 500;
            font-size: 16px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s ease;
        }

        .btn-get-started:hover {
            background: #df7d0d;
            color: #ffffff;
        }

        .btn-get-started i {
            margin-right: 8px;
        }

        .btn-login {
            background: transparent;
            border: 1px solid #e5e5e5;
            color: #555555;
            padding: 12px 30px;
            border-radius: 4px;
            font-weight: 500;
            font-size: 16px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s ease;
            margin-left: 10px;
        }

        .btn-login:hover {
            background: #fafafa;
            border-color: #f28c18;
            color: #f28c18;
        }

        .btn-login i {
            margin-right: 8px;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* Footer */
        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #cccccc;
        }

        .footer strong {
            color: #f28c18;
            font-weight: 600;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .welcome-card {
                padding: 35px 20px;
            }

            .welcome-card h1 {
                font-size: 24px;
            }

            .features {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .button-group {
                flex-direction: column;
            }

            .btn-login {
                margin-left: 0;
            }

            .btn-get-started,
            .btn-login {
                width: 100%;
                text-align: center;
            }
        }

        @media (min-width: 481px) and (max-width: 768px) {
            .features {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>

</head>
<body>

<div class="welcome-container">

    <div class="welcome-card">

        <!-- Logo -->
        <div class="logo-wrapper">
            <div class="logo-icon">
                <i class="bi bi-tv"></i>
            </div>
        </div>

        <!-- Heading -->
        <h1>SATPAY</h1>
        <div class="subtitle">
            <i class="bi bi-credit-card me-1"></i>
            Payment Management Portal
        </div>

        <p class="description">
            Welcome to a simple and secure system for paying and activating decoder packages. 
            Manage your subscriptions with ease.
        </p>

        <!-- Features -->
        <div class="features">
            <div class="feature-item">
                <i class="bi bi-box"></i>
                <span>Packages</span>
            </div>
            <div class="feature-item">
                <i class="bi bi-credit-card"></i>
                <span>Payments</span>
            </div>
            <div class="feature-item">
                <i class="bi bi-shield-check"></i>
                <span>Secure</span>
            </div>
        </div>

        <!-- Buttons -->
        <div class="button-group">
            <a href="{% url 'register' %}" class="btn-get-started">
                <i class="bi bi-person-plus"></i>
                Get Started
            </a>
            <a href="{% url 'login' %}" class="btn-login">
                <i class="bi bi-box-arrow-in-right"></i>
                Login
            </a>
        </div>

        <!-- Footer -->
        <div class="footer">
            &copy; 2026 <strong>SATPAY</strong>. All rights reserved.
        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
