{% extends 'base.html' %}

{% block content %}

<div class="main-content">
    <div class="container-fluid px-4">

        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="fw-bold mb-0" style="color: #333333;">
                    <i class="bi bi-gear me-2" style="color: #f28c18;"></i>
                    Business Settings
                </h4>
                <p class="text-muted small mt-1">
                    Update your business information
                </p>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-8">

                <div class="card" style="border: 1px solid #e5e5e5; border-radius: 6px;">
                    <div class="card-body">

                        <form method="POST">
                            {% csrf_token %}

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Business Name</label>
                                <input type="text" name="business_name" class="form-control" value="{{ business.business_name }}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Business Address</label>
                                <textarea name="business_address" class="form-control" rows="3">{{ business.business_address }}</textarea>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Business Phone</label>
                                <input type="text" name="business_phone" class="form-control" value="{{ business.business_phone }}">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Business Email</label>
                                <input type="email" name="business_email" class="form-control" value="{{ business.business_email }}">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Tax ID</label>
                                <input type="text" name="tax_id" class="form-control" value="{{ business.tax_id }}">
                            </div>

                            <button type="submit" class="btn" style="background: #f28c18; color: white; width: 100%; padding: 12px;">
                                <i class="bi bi-save me-1"></i>
                                Save Settings
                            </button>

                        </form>

                    </div>
                </div>

            </div>
        </div>

    </div>
</div>

{% endblock %}
